name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.26.0)"
        required: true
      title:
        description: "Release title"
        required: true
      body:
        description: "Release notes"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.tag }}" \
            --title "${{ github.event.inputs.title }}" \
            --notes "${{ github.event.inputs.body }}" \
            --verify-tag || \
          gh release create "${{ github.event.inputs.tag }}" \
            --title "${{ github.event.inputs.title }}" \
            --notes "${{ github.event.inputs.body }}"
